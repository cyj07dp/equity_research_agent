services:
  postgres:
    image: postgres:16
    container_name: equity_research_postgres
    environment:
      POSTGRES_DB: equity_research
      POSTGRES_USER: equity_user
      POSTGRES_PASSWORD: equity_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equity_user -d equity_research"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
